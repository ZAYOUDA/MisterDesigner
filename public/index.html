<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Éditeur de conception IBM Planning Analytics / TM1 : cubes, dimensions, liens, import Excel et export HTML.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>CubeDesigner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style id="app-style">
/* Layout: app shell — top bar, left palette (types + dimension catalog), pan/zoom drafting stage or Dims×Cubes matrix, right properties panel */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D7DDE5; --line-2:#E6EAEF;
  --ink:#16202C; --ink-2:#435063; --ink-3:#667284; --accent:#1D5C8A; --accent-ink:#FFFFFF; --accent-soft:#E2ECF5;
  --grid:#C6CED9; --hl:#E09B1B; --hl-soft:#FFF2D6; --danger:#B3261E; --danger-soft:#FBE9E7; --ok:#2E7D32; --ok-soft:#E5F3E6;
  --w-rule:#1D5C8A; --w-ti:#7347C1; --w-feed:#B8611A; --w-read:#2D8638;
  --shadow:0 1px 2px rgba(18,28,40,.06),0 4px 12px rgba(18,28,40,.06);
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --panel:#151D26; --panel-2:#1A242F; --line:#2B3644; --line-2:#222D39;
  --ink:#E3E9F0; --ink-2:#AEB9C6; --ink-3:#8793A2; --accent:#6EA6D6; --accent-ink:#0B1520; --accent-soft:#1C3045;
  --grid:#27323F; --hl:#E8A93A; --hl-soft:#3A2E14; --danger:#F28B82; --danger-soft:#3B1E1C; --ok:#7CC883; --ok-soft:#1C3320;
  --w-rule:#6EA6D6; --w-ti:#B08BEB; --w-feed:#E7964F; --w-read:#6CC478;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1319; --panel:#151D26; --panel-2:#1A242F; --line:#2B3644; --line-2:#222D39;
  --ink:#E3E9F0; --ink-2:#AEB9C6; --ink-3:#8793A2; --accent:#6EA6D6; --accent-ink:#0B1520; --accent-soft:#1C3045;
  --grid:#27323F; --hl:#E8A93A; --hl-soft:#3A2E14; --danger:#F28B82; --danger-soft:#3B1E1C; --ok:#7CC883; --ok-soft:#1C3320;
  --w-rule:#6EA6D6; --w-ti:#B08BEB; --w-feed:#E7964F; --w-read:#6CC478;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.mtitle{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
#mname{border:0;background:none;padding:2px 4px;border-radius:4px;font-weight:600;font-size:14px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#mname:hover{background:var(--panel-2)}
.saved{font-size:12px;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:10px;white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line-2);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink);min-height:34px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn.ic{width:30px;padding:0;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--panel)}
.themes{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line-2);padding:2px;border-radius:7px}
.themes button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:5px 8px;border-radius:5px;font-size:12px;color:var(--ink-2);min-height:30px}
.themes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
@media (max-width:1180px){.themes button span{display:none}}
.robadge{font-size:12px;color:var(--ink-2);border:1px dashed var(--line);padding:4px 9px;border-radius:12px}
.ro .edit-only{display:none!important}

/* main */
.main{flex:1 1 auto;display:flex;min-height:0}
.left,.right{flex:none;background:var(--panel);overflow:auto}
.left{width:252px;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:22px}
.right{width:316px;border-left:1px solid var(--line);padding:18px}
.left h2,.sect-h{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.types button{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel-2);padding:7px 8px;border-radius:6px;font-size:12px;text-align:left;min-height:36px}
.types button:hover{border-color:var(--accent)}
.types .newtype{grid-column:1 / -1;justify-content:center;border-style:dashed;background:transparent;color:var(--accent);font-weight:600}
.types .plus{font-size:16px;line-height:1}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent);font-size:12.5px;font-weight:600;min-height:28px}
.linkbtn:hover{text-decoration:underline}
.legend .linkbtn{padding:0 4px;font-weight:500;font-size:12px;min-height:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swc{display:inline-flex;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swc input{width:48px;height:48px;margin:-7px;border:0;padding:0;cursor:pointer}
.shapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.shp{display:flex!important;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12.5px}
.shp:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.shp input{margin:0}
.shp-i{display:inline-flex}
.tprev{width:96px;height:96px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px}
.field{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;font-size:13px}
textarea.field{resize:vertical;min-height:64px}
.row{display:flex;gap:6px}
.row .field{flex:1;min-width:0}
.dimlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.dimi{width:100%;display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:5px 8px;border-radius:5px;text-align:left;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);min-height:28px}
.dimi:hover{background:var(--panel-2);color:var(--ink)}
.dimi.on{background:var(--hl-soft);color:var(--ink)}
.dimi .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dimi .du{font-family:var(--f-sans);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.dimi[draggable="true"]{cursor:grab}
.mt{font-family:var(--f-sans);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:15px;flex:none}
.hint{font-size:12px;color:var(--ink-3);margin:8px 0 0}

/* stage */
.stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12.5px}
.stagebar label{color:var(--ink-3);font-size:12px}
.stagebar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;font-size:12.5px;min-height:30px}
.sep{width:1px;height:22px;background:var(--line)}
.zoom{display:flex;align-items:center;gap:4px;margin-left:auto}
#z-val{min-width:58px;justify-content:center;font-variant-numeric:tabular-nums}
.viewport{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);background-size:20px 20px}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
#nodes,.labels{position:absolute;left:0;top:0}
.vhint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line-2);padding:4px 9px;border-radius:12px;pointer-events:none;max-width:calc(100% - 24px)}

/* cube nodes */
.node{position:absolute;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;transition:opacity .15s}
.node.sel{outline:2px solid var(--accent);outline-offset:1px}
.node.hl{outline:2px solid var(--hl);outline-offset:1px}
.node.sel.hl{outline-color:var(--accent)}
.node.dimmed{opacity:.35}
.node.drop{outline:2px dashed var(--accent);outline-offset:2px}
.nh{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;min-height:62px;cursor:grab}
.ro .nh{cursor:pointer}
.ico{flex:none;display:inline-flex}
.nt{flex:1;min-width:0}
.nn{font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.nm{font-size:11px;color:var(--ink-3);margin-top:2px}
.tg{flex:none;width:30px;height:30px;border:1px solid var(--line-2);background:var(--panel);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink-2)}
.tg:hover{border-color:var(--ink-3)}
.tg svg{transition:transform .15s}
.tg[aria-expanded="true"] svg{transform:rotate(180deg)}
.nd{list-style:none;margin:0;padding:6px 10px;border-top:1px solid var(--line-2)}
.nd li{height:24px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.nd li span:first-child{overflow:hidden;text-overflow:ellipsis}
.nd li.on{background:var(--hl-soft);color:var(--ink);margin:0 -10px;padding:0 10px}
.nd li.empty{font-family:var(--f-sans);font-style:italic;color:var(--ink-3)}
.port{position:absolute;right:-8px;top:24px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);padding:0;cursor:crosshair}
.port:hover{background:var(--accent)}
.ro .port{display:none}

/* wires */
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.w{fill:none;stroke-width:2}
.w-rule{stroke:var(--w-rule)} .w-ti{stroke:var(--w-ti);stroke-dasharray:7 5} .w-feeder{stroke:var(--w-feed);stroke-dasharray:2 4} .w-read{stroke:var(--w-read);stroke-dasharray:10 4 2 4}
.w.sel{stroke-width:3.5}
.w.faded{opacity:.25}
.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.wl{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 7px;border-radius:15px;background:var(--panel);border:2px solid currentColor;font:700 11px var(--f-sans);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.wl-rule{color:var(--w-rule)} .wl-ti{color:var(--w-ti)} .wl-feeder{color:var(--w-feed)} .wl-read{color:var(--w-read)}
.wl.sel{box-shadow:0 0 0 4px var(--accent-soft)}
.wl.faded{opacity:.3}

/* matrix */
.matrix{flex:1 1 auto;overflow:auto;background:var(--panel)}
.mx{border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0}
.mx thead th{position:sticky;top:0;background:var(--panel-2);z-index:2;vertical-align:bottom;border-bottom:1px solid var(--line)}
.mx tbody th{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;border-right:1px solid var(--line)}
.mx thead th.corner{left:0;z-index:3;text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);min-width:240px;border-right:1px solid var(--line)}
.ch{width:118px;min-width:118px}
.ch button{width:100%;border:0;background:transparent;padding:10px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.ch .nb{display:block;font-size:11px;font-weight:500;color:var(--ink-3);padding-bottom:6px;font-variant-numeric:tabular-nums}
.mx tbody th button{border:0;background:transparent;width:100%;text-align:left;padding:6px 12px;font-family:var(--f-mono);font-size:12.5px;display:flex;align-items:center;gap:8px;min-height:32px}
.cell{width:100%;height:32px;border:0;background:transparent;font:600 13px var(--f-mono);color:var(--accent)}
.cell:not(:disabled):hover{background:var(--accent-soft)}
.cell:disabled{cursor:default}
.mx td.csel,.mx th.csel{background:var(--accent-soft)}
.mx tr.rhl th,.mx tr.rhl td{background:var(--hl-soft)}
.mx td.use,.mx th.use{text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px;min-width:90px;padding:0 8px}
.mx-add{display:flex;gap:6px;padding:12px;max-width:420px}

/* right panel */
.ph{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.ptitle{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.right label.l{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 4px}
.sect{margin-top:20px}
.pdims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.pdims li{display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:5px;padding:2px 2px 2px 8px;font-family:var(--f-mono);font-size:12px;min-height:32px}
.pdims .pi{color:var(--ink-3);min-width:18px;font-variant-numeric:tabular-nums}
.pdims .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:0;background:transparent;width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);padding:0}
.mini:hover{background:var(--panel-2);color:var(--ink)}
.plinks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plinks button,.plist button{width:100%;border:1px solid var(--line-2);background:transparent;border-radius:5px;padding:6px 8px;display:flex;gap:8px;align-items:center;text-align:left;font-size:12.5px;min-height:34px}
.plinks button:hover,.plist button:hover{border-color:var(--ink-3)}
.lb{font-weight:700;font-size:11px;min-width:26px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.stat{border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--panel-2)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend li{display:flex;align-items:center;gap:8px}
.legend .cnt{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.help{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
.note{font-size:12.5px;background:var(--hl-soft);border-radius:6px;padding:9px 11px;margin-top:12px;color:var(--ink)}
.pfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--panel);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(680px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column}
.mbox h2{margin:0;font-size:17px;text-wrap:balance}
.mhead{padding:18px 20px 6px}
.mbody{padding:6px 20px 12px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line-2)}
.detect{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 12px;font-size:13px;color:var(--ink-2)}
.detect b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.prev{border:1px solid var(--line-2);border-radius:6px;max-height:300px;overflow:auto}
.prev table{width:100%;border-collapse:collapse;font-size:12.5px}
.prev th,.prev td{text-align:left;padding:5px 10px;border-bottom:1px solid var(--line-2)}
.prev thead th{position:sticky;top:0;background:var(--panel-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prev select{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 4px;font-size:12px}
.prev td.n{font-variant-numeric:tabular-nums;color:var(--ink-3)}
.opts{border:0;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opts legend{font-size:12px;color:var(--ink-2);margin-bottom:6px;padding:0}
.opts label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.opts small{display:block;color:var(--ink-3);font-size:12px}
.err{color:var(--danger);background:var(--danger-soft);padding:10px 12px;border-radius:6px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:900px){
  #app{height:auto;min-height:100%}
  .main{flex-direction:column}
  .stage{order:1;height:72vh;min-height:420px}
  .left{order:2;width:auto;border-right:0;border-top:1px solid var(--line)}
  .right{order:3;width:auto;border-left:0;border-top:1px solid var(--line)}
  .mtitle{border-left:0;padding-left:0}
  .zoom{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 36 36" aria-hidden="true"><polygon points="0,8 8,0 36,0 28,8" fill="#4C88B4"></polygon><rect x="0" y="8" width="28" height="28" fill="#1F5F8B"></rect><polygon points="28,8 36,0 36,28 28,36" fill="#14435F"></polygon></svg>

function toWorld(cx, cy){ var r = vp.getBoundingClientRect(); return { x:(cx - r.left - view.x)/view.k, y:(cy - r.top - view.y)/view.k }; }
vp.addEventListener('pointerdown', function(e){
  if (e.button !== 0) return;

function startPan(e){

  vp.setPointerCapture(e.pointerId); vp.classList.add('panning');
  function mv(ev){ var dx = ev.clientX - sx, dy = ev.clientY - sy; if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return; moved = true; view.x = vx + dx; view.y = vy + dy; applyView(); }
  function up(){ vp.removeEventListener('pointermove', mv); vp.removeEventListener('pointerup', up); vp.removeEventListener('pointercancel', up); vp.classList.remove('panning'); if (moved) suppress = true; }
  vp.addEventListener('pointermove', mv); vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
}
function startNodeDrag(e, el){
  var c = cube(el.dataset.id), sx = e.clientX, sy = e.clientY, cx = c.x, cy = c.y, moved = false, before = snap();
  el.setPointerCapture(e.pointerId);
  function mv(ev){
    var dx = (ev.clientX - sx)/view.k, dy = (ev.clientY - sy)/view.k;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (readonly) return;

    c.x = Math.round((cx + dx)/10)*10; c.y = Math.round((cy + dy)/10)*10;
    el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; renderWires();
  }

}
function startLink(e, fromId){
  var port = e.target; port.setPointerCapture(e.pointerId);
  var a = rects()[fromId], x1 = a.x + a.w, y1 = a.y + 32;
  function mv(ev){ var p = toWorld(ev.clientX, ev.clientY), d = Math.max(40, Math.abs(p.x - x1)/2); tmpw.setAttribute('d', 'M'+x1+' '+y1+' C'+(x1+d)+' '+y1+' '+(p.x-d)+' '+p.y+' '+p.x+' '+p.y); }

}

function saveFile(filename, data){
  var fallback = function(){
    try {
      var blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : 'text/html' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Fichier exporté : ' + filename);
    } catch (err) { toast('Export impossible dans ce navigateur'); }
  };
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function(dl){
      if (!dl) { fallback(); return; }
      return dl.save({ filename:filename, data:data }).then(function(){ toast('Fichier exporté : ' + filename); }, function(err){
        var c = err && err.code;
        if (c === 'declined') toast('Export annulé');
        else if (c === 'rate_limited') toast('Une demande d’enregistrement est déjà ouverte');
        else toast('Export impossible : ' + ((err && err.message) || c || 'erreur inconnue'));

/* ---------- PNG export ---------- */
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#000000'; }
function loadSvg(svg){
  return new Promise(function(res){
    var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
  });
}
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  var words = String(text).split(/\s+/), lines = [], cur = '';

    var tryL = cur ? cur + ' ' + wd : wd;
    if (ctx.measureText(tryL).width <= w) { cur = tryL; return; }
    if (cur) lines.push(cur);
    while (ctx.measureText(wd).width > w) { var k = wd.length; while (k > 1 && ctx.measureText(wd.slice(0, k)).width > w) k--; lines.push(wd.slice(0, k)); wd = wd.slice(k); }
    cur = wd;
  });

}
function exportPNG(){
  if (!model.cubes.length) { toast('Aucun cube à exporter'); return; }
  var keepHl = hl, keepSel = sel, keepTab = tab;
  hl = null; sel = null; tab = 'schema'; renderAll();
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  var icons = {};
  var jobs = model.cubes.map(function(c){ return c.type; }).filter(function(t, i, a){ return a.indexOf(t) === i; })
    .map(function(t){ return loadSvg(icon(t, 32)).then(function(im){ icons[t] = im; }); });
  Promise.all([fontsReady].concat(jobs)).then(function(){
    var r = rects(), x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    Object.keys(r).forEach(function(id){ var b = r[id]; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
    var wires = model.links.map(function(l){ var a = r[l.from], b = r[l.to]; return a && b ? { l:l, g:geom(a, b) } : null; }).filter(Boolean);
    wires.forEach(function(w){ x0 = Math.min(x0, w.g.mx - 30); x1 = Math.max(x1, w.g.mx + 30); y0 = Math.min(y0, w.g.my - 20); y1 = Math.max(y1, w.g.my + 20); });
    var pad = 48, head = 86, W = Math.max(x1 - x0 + pad * 2, 640), H = y1 - y0 + pad * 2 + head;
    var sc = Math.min(2, 8000 / W, 8000 / H, Math.sqrt(32e6 / (W * H)));
    var cv = document.createElement('canvas'); cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    var ctx = cv.getContext('2d'); ctx.scale(sc, sc);
    var C = { bg:cssVar('--bg'), panel:cssVar('--panel'), line:cssVar('--line'), line2:cssVar('--line-2'), ink:cssVar('--ink'), ink2:cssVar('--ink-2'), ink3:cssVar('--ink-3'), grid:cssVar('--grid') };
    var sans = getComputedStyle(document.body).fontFamily, mono = cssVar('--f-mono');
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.grid;
    for (var gx = 10; gx < W; gx += 20) for (var gy = head + 10; gy < H; gy += 20) ctx.fillRect(gx, gy, 1.2, 1.2);
    // header band
    ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, head); ctx.fillStyle = C.line; ctx.fillRect(0, head - 1, W, 1);
    ctx.textBaseline = 'alphabetic'; ctx.fillStyle = C.ink; ctx.font = '700 22px ' + sans;
    ctx.fillText(fitText(ctx, model.name, W - pad * 2 - 360), pad, 40);

    ctx.fillText(model.cubes.length + ' cubes · ' + model.dims.length + ' dimensions · ' + model.links.length + ' liens · ' + dt.toLocaleDateString('fr-FR'), pad, 64);
    var lx = W - pad; ctx.font = '500 12px ' + sans; ctx.textAlign = 'right';
    Object.keys(KINDS).reverse().forEach(function(k){
      ctx.fillStyle = C.ink2; ctx.fillText(KINDS[k].label, lx, 48); var tw = ctx.measureText(KINDS[k].label).width;
      ctx.strokeStyle = cssVar(KIND_VAR[k]); ctx.lineWidth = 2; ctx.setLineDash(KIND_DASH[k] ? KIND_DASH[k].split(' ').map(Number) : []);
      ctx.beginPath(); ctx.moveTo(lx - tw - 34, 44); ctx.lineTo(lx - tw - 8, 44); ctx.stroke(); ctx.setLineDash([]);

      ctx.lineTo(g.x2 - L * Math.cos(an) + Wd * Math.sin(an), g.y2 - L * Math.sin(an) - Wd * Math.cos(an));
      ctx.lineTo(g.x2 - L * Math.cos(an) - Wd * Math.sin(an), g.y2 - L * Math.sin(an) + Wd * Math.cos(an)); ctx.closePath(); ctx.fill();
    });
    // nodes
    Array.prototype.forEach.call(nodesEl.children, function(el){
      var c = cube(el.dataset.id), b = r[c.id];
      ctx.save(); ctx.shadowColor = 'rgba(10,20,30,0.12)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
      rrect(ctx, b.x, b.y, b.w, b.h, 8); ctx.fillStyle = C.panel; ctx.fill(); ctx.restore();
      rrect(ctx, b.x + .5, b.y + .5, b.w - 1, b.h - 1, 8); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
      var ic = el.querySelector('.ico'); if (icons[c.type]) ctx.drawImage(icons[c.type], b.x + ic.offsetLeft, b.y + ic.offsetTop, 32, 32);

      ctx.fillStyle = C.ink3; ctx.font = '400 11px ' + sans;
      ctx.fillText(fitText(ctx, nm.textContent, nm.offsetWidth), b.x + nm.offsetLeft, b.y + nm.offsetTop + 1);
      var ol = el.querySelector('.nd');

        Array.prototype.forEach.call(ol.children, function(li){
          var ly = b.y + li.offsetTop + 12, lxx = b.x + li.offsetLeft, lw = li.offsetWidth, tag = li.querySelector('.mt');
          ctx.textBaseline = 'middle';
          if (li.classList.contains('empty')) { ctx.fillStyle = C.ink3; ctx.font = 'italic 400 12px ' + sans; ctx.fillText(li.textContent, lxx, ly); return; }
          var tagW = 0;
          if (tag) {

            rrect(ctx, lxx + lw - tagW, ly - 8, tagW, 16, 3); ctx.strokeStyle = C.line; ctx.stroke();
            ctx.fillStyle = C.ink3; ctx.fillText('MES.', lxx + lw - tagW + 4, ly + .5); tagW += 6;
          }

          ctx.fillText(fitText(ctx, li.firstChild.textContent, lw - tagW), lxx, ly);

    });
    // link labels
    wires.forEach(function(w){
      var col = cssVar(KIND_VAR[w.l.kind]), t = w.l.label || '·';
      ctx.font = '700 11px ' + sans; var bw = Math.max(30, ctx.measureText(t).width + 18);
      rrect(ctx, w.g.mx - bw / 2, w.g.my - 15, bw, 30, 15); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();

    });
    ctx.restore();
    hl = keepHl; sel = keepSel; tab = keepTab; renderAll();
    cv.toBlob(function(blob){
      if (!blob) { toast('Le schéma est trop grand pour être exporté en image'); return; }
      saveFile(slug() + '.png', blob);
    }, 'image/png');
  });
}

/* ---------- import ---------- */
$('#file').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var ext = (f.name.split('.').pop() || '').toLowerCase(), base = f.name.replace(/\.[^.]+$/, '');
  var rd = new FileReader();
  if (ext === 'json' || ext === 'html' || ext === 'htm' || ext === 'csv') {
    rd.onload = function(){
      var txt = String(rd.result);
      try {
        if (ext === 'csv') { excelDialog(f.name, base, { 'CSV': parseCSV(txt) }); return; }
        var m;
        if (ext === 'json') m = JSON.parse(txt);
        else { var el = new DOMParser().parseFromString(txt, 'text/html').getElementById('cd-model'); if (!el || !el.textContent.trim()) throw new Error('nomodel'); m = JSON.parse(el.textContent); }
        if (!m || !Array.isArray(m.cubes)) throw new Error('nomodel');
        mutate(function(){ model = normalize(m); });
        sel = null; hl = null; renderAll(); fit(); toast('Modèle « ' + model.name + ' » importé · Ctrl + Z pour annuler');
      } catch (err) { toast(ext === 'json' ? 'Ce fichier JSON n’est pas un modèle CubeDesigner' : 'Ce fichier HTML ne contient pas de modèle CubeDesigner exporté'); }
    };
    rd.readAsText(f);
  } else if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
    if (!window.XLSX) { toast('La lecture Excel nécessite une connexion internet. Enregistrez la feuille en CSV pour importer hors ligne.'); return; }
    rd.onload = function(){
      try {
        var wb = window.XLSX.read(new Uint8Array(rd.result), { type:'array' }), sheets = {};
        wb.SheetNames.forEach(function(n){ sheets[n] = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'', raw:false, blankrows:true }); });
        excelDialog(f.name, base, sheets);
      } catch (err) { toast('Impossible de lire ce classeur Excel'); }
    };
    rd.readAsArrayBuffer(f);
  } else toast('Format non pris en charge : .xlsx, .csv, .html ou .json');
});
function parseCSV(text){
  var first = text.split(/\r?\n/)[0] || '';
  var d = [';', '\t', ','].sort(function(a, b){ return first.split(b).length - first.split(a).length; })[0];
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function clean(v){ return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
function isMark(v){ v = clean(v).toLowerCase(); return !!v && ['0','non','no','-','false','faux'].indexOf(v) < 0; }
function parseMatrix(rows){
  var hr = -1, hc = -1, found = false, r, c;
  for (r = 0; r < Math.min(rows.length, 60) && hr < 0; r++) for (c = 0; c < (rows[r] || []).length; c++) if (/dims?\s*[\\\/|×x]\s*cubes?/i.test(clean(rows[r][c]))) { hr = r; hc = c; found = true; break; }
  if (hr < 0) for (r = 0; r < Math.min(rows.length, 60) && hr < 0; r++) {
    var row = rows[r] || [], c0 = -1, n = 0;
    for (c = 0; c < row.length; c++) { if (clean(row[c])) { if (c0 < 0) c0 = c; else n++; } }
    if (c0 >= 0 && n >= 2) { hr = r; hc = c0; }
  }
  if (hr < 0) return { cubes:[], dims:[], marks:0, found:false };
  var cols = [], names = {};
  for (c = hc + 1; c < (rows[hr] || []).length; c++) {
    var nm = clean(rows[hr][c]); if (!nm) continue;
    var u = nm, k = 2; while (names[u]) u = nm + ' (' + (k++) + ')'; names[u] = 1;
    cols.push({ c:c, name:u, dims:[] });
  }
  var dims = [], marks = 0;
  for (r = hr + 1; r < rows.length; r++) {
    var dn = clean((rows[r] || [])[hc]); if (!dn || dims.indexOf(dn) >= 0) continue;
    dims.push(dn);
    cols.forEach(function(col){ if (isMark((rows[r] || [])[col.c])) { col.dims.push(dn); marks++; } });
  }
  return { cubes: cols.map(function(x){ return { name:x.name, dims:x.dims }; }), dims:dims, marks:marks, found:found };
}
function excelDialog(fileName, base, sheets){
  var names = Object.keys(sheets);
  var sheet = names.filter(function(n){ return parseMatrix(sheets[n]).found; })[0] || names[0];
  var parsed, types, mode = (!model.cubes.length || model.sample) ? 'replace' : 'merge';
  function compute(){ parsed = parseMatrix(sheets[sheet]); types = parsed.cubes.map(function(c){ return guessType(c.name); }); }
  function draw(){
    var ok = parsed.cubes.length > 0;
    var html = '<div class="mhead"><div class="eyebrow">Import Excel</div><h2>Matrice Dimensions × Cubes</h2><p class="hint" style="margin-top:4px">' + esc(fileName) + '</p></div><div class="mbody">' +
      (names.length > 1 ? '<label class="l" for="m-sheet" style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px">Feuille</label><select id="m-sheet" class="field">' + names.map(function(n){ return '<option' + (n === sheet ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>' : '');
    if (!ok) html += '<p class="err" style="margin-top:12px">Aucune matrice trouvée dans cette feuille. La feuille doit contenir une cellule « Dims\\Cubes » avec les noms de cubes à sa droite, les dimensions en dessous et une marque (X) à chaque croisement.</p>';
    else html += '<div class="detect"><span><b>' + parsed.cubes.length + '</b> cubes</span><span><b>' + parsed.dims.length + '</b> dimensions</span><span><b>' + parsed.marks + '</b> croisements</span></div>' +
      '<div class="prev"><table><thead><tr><th>Cube</th><th>Type détecté</th><th>Dims</th></tr></thead><tbody>' +
      parsed.cubes.map(function(c, i){ return '<tr><td>' + esc(c.name) + '</td><td><select data-ti="' + i + '" aria-label="Type de ' + esc(c.name) + '">' + opts(TYPES, types[i]) + '</select></td><td class="n">' + c.dims.length + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<fieldset class="opts"><legend>Que faire du modèle actuel ?</legend>' +
      '<label><input type="radio" name="m-mode" value="replace"' + (mode === 'replace' ? ' checked' : '') + '><span>Remplacer le modèle<small>Repart de la matrice importée, sans liens.</small></span></label>' +
      '<label><input type="radio" name="m-mode" value="merge"' + (mode === 'merge' ? ' checked' : '') + '><span>Fusionner<small>Met à jour les dimensions des cubes de même nom, ajoute les nouveaux, garde positions et liens.</small></span></label></fieldset>';
    html += '</div><div class="mfoot"><button type="button" class="btn" data-m="cancel">Annuler</button>' + (ok ? '<button type="button" class="btn primary" data-m="import">Importer ' + parsed.cubes.length + ' cubes</button>' : '') + '</div>';
    $('#mbox').innerHTML = html;
    var s = $('#m-sheet'); if (s) s.addEventListener('change', function(e){ sheet = e.target.value; compute(); draw(); });
    $('#mbox').querySelectorAll('[data-ti]').forEach(function(el){ el.addEventListener('change', function(){ types[+el.dataset.ti] = el.value; }); });
    $('#mbox').querySelectorAll('[name=m-mode]').forEach(function(el){ el.addEventListener('change', function(){ mode = el.value; }); });
  }
  compute();
  openModal('', function(act){
    if (act !== 'import') return;
    var cubes = parsed.cubes.map(function(c, i){ return { name:c.name, type:types[i], dims:c.dims }; }), added = 0;
    mutate(function(){
      if (mode === 'replace') {
        model = normalize({ name:base, types:model.types, dims: parsed.dims.map(function(n){ return { name:n, measure:guessMeasure(n) }; }), cubes: cubes.map(function(c){ return { id:uid('c'), name:c.name, type:c.type, dims:c.dims, open:false }; }) });
        autoLayout(model.cubes); added = cubes.length;
      } else {
        parsed.dims.forEach(function(n){ if (!dimObj(n)) model.dims.push({ name:n, measure:guessMeasure(n), desc:'' }); });
        var fresh = [];
        cubes.forEach(function(c){
          var ex = model.cubes.filter(function(x){ return x.name.toLowerCase() === c.name.toLowerCase(); })[0];
          if (ex) ex.dims = c.dims.slice();
          else { var nc = { id:uid('c'), name:c.name, type:c.type, x:0, y:0, open:false, desc:'', dims:c.dims.slice() }; fresh.push(nc); }
        });
        autoLayout(fresh, model.cubes); model.cubes = model.cubes.concat(fresh); added = fresh.length;
      }
    });
    sel = null; hl = null; closeModal(); tab = 'schema'; renderAll(); fit();
    toast(mode === 'replace' ? parsed.cubes.length + ' cubes et ' + parsed.dims.length + ' dimensions importés' : added + ' cubes ajoutés, ' + (parsed.cubes.length - added) + ' mis à jour');
  });
  draw();
}

/* ---------- theme ---------- */
var THEME_KEY = 'cubedesigner.theme';
function applyTheme(t){
  var root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.themeSet === t); });
}
var theme = 'light';
try { theme = localStorage.getItem(THEME_KEY) || 'light'; } catch(e){}
applyTheme(theme);
document.querySelector('.themes').addEventListener('click', function(e){
  var b = e.target.closest('[data-theme-set]'); if (!b) return;
  theme = b.dataset.themeSet; applyTheme(theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch(err){}
});

/* ---------- boot ---------- */
model = load();
renderAll();
requestAnimationFrame(fit);
if (embedded) $('#saved').textContent = 'Fichier partagé';
else if (model.updated) { var d0 = new Date(model.updated); $('#saved').textContent = 'Enregistré · ' + String(d0.getHours()).padStart(2,'0') + ':' + String(d0.getMinutes()).padStart(2,'0'); }
else $('#saved').textContent = 'Exemple';
if (restoredMsg) toast(restoredMsg);
})();
